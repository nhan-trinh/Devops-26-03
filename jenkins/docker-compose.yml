# Docker Compose de chay Jenkins tren may Local
# Su dung co che Docker-outside-of-Docker (DooD) va mount truc tiep source code local

services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"    # Web UI Jenkins
      - "50000:50000"  # Cong agent
    volumes:
      # Luu tru toan bo du lieu Jenkins da co san
      - jenkins_jenkins_home:/var/jenkins_home

      # Mount Docker socket may Host
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount truc tiep repo local vao /repo (GIUP CHECKOUT TRONG 0.5 GIAY KHONG BI NGHEN MANG GITHUB)
      - D:\DevOps-test\Devops-26-03:/repo:ro

    group_add:
      - "0"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

    restart: unless-stopped

volumes:
  jenkins_jenkins_home:
    external: true
