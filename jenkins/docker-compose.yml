# Docker Compose để chạy Jenkins trên máy Local (Laptop/PC)
# Sử dụng cơ chế Docker-outside-of-Docker (DooD) bằng cách mount docker.sock

services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"    # Web UI Jenkins
      - "50000:50000"  # Cổng kết nối Agent (nếu dùng)
    volumes:
      # Lưu trữ toàn bộ dữ liệu Jenkins (Jobs, Build history, Credentials, Plugins)
      - jenkins_home:/var/jenkins_home

      # Mount Docker socket của máy Host vào container Jenkins
      # Giúp Jenkins điều khiển Docker daemon của máy host để build và deploy container
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      # Cấp quyền đọc/ghi docker.sock cho user jenkins
      - "0"

    environment:
      # Bỏ qua Setup Wizard khởi động (tiết kiệm thời gian)
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

    restart: unless-stopped

volumes:
  jenkins_home:
